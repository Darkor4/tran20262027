<!DOCTYPE html>

<html>
  <head>
    <title>Template</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">

    <!-- Load Fira Code from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">

    <style>
      /* VSCode Dark Theme inspired styling */
      body { 
        margin: 0; 
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        background-color: #252526;
        color: #e0e0e0;
      }

      body > * {
        background-color: #1e1e1e;
        border: 1px solid #858585;
      }

      body > *:not(nav) {
        margin: 5px;
        padding: 0;
        border-radius: 0;
      }

      nav {
        border: none;
        border-bottom: 1px solid #858585;
      }

      header h1 { margin: 0; padding: 0.5rem 1rem; }

      /* keep simple nav styling but no positioning rules */
      nav ul { margin: 0; padding: 0 1rem; list-style: none; display: flex; gap: 0.5rem; align-items: center; }
      nav a { color: inherit; text-decoration: none; padding: 0.25rem 0.5rem; display: block; }
    </style>
  </head>

  <body>
    <nav aria-label="Main navigation">
      <ul>
        <li style="background-color: rgba(0, 0, 0, 0.1);"><a href="./">Homepage</a></li>
        <li><a href="work">Your work</a></li>
        <li><a href="references">references</a></li>
      </ul>
    </nav>

    <header>
      <h1>2026 2027</h1>
    </header>

    <main>
      <h2>Why does this site exist?</h2>
      <p>This site is for Mr. Tran's 2026 2027 8th grade class to put up their digital work.</p>
    </main>

    <footer>
      <p>Made by Eliot</p>
    </footer>
  </body>
</html>
