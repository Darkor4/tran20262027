<!DOCTYPE html>

<html>
  <head>
    <title>Template</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">

    <style>
      /* basic reset so sticky can reach the viewport edge */
      body { margin: 0; font-family: system-ui, sans-serif; }

      /* Sticky navbar: MUST include top (or bottom) */
      nav {
        position: sticky;
        top: 0;               /* required for stickiness */
        z-index: 999;         /* keep it above content */
        background-color: peru;
        color: gainsboro;
      }

      /* layout tweaks so the nav spans the page */
      nav ul {
        margin: 0;
        padding: 0.5rem 1rem;
        list-style: none;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      nav li { display: inline-block; }
      nav li:first-child { background-color: rgba(0,0,0,0.5); }
      nav a { color: inherit; text-decoration: none; padding: 0.25rem 0.5rem; display: block; }
    </style>
  </head>

  <body>
    <header>
      <h1>2026 2027</h1>
      <nav>
        <ul>
          <li><a href="./">Homepage</a></li>
          <li><a href="work">Your work</a></li>
          <li><a href="references">references</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Why does this site exist?</h2>
      <p>This site is for Mr. Tran's 2026 2027 8th grade class to put up their digital work.</p>
      <!-- add extra content here to test scrolling -->
      <div style="height:2000px"></div>
    </main>

    <footer>
      <p>Made by Eliot</p>
    </footer>
  </body>
</html>
